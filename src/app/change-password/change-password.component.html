<p>change-password works!</p>
<div class="container">
    <h3>Change Password</h3>
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="currentPassword" class="form-label">Current Password:</label>
        <input type="password" id="currentPassword" formControlName="currentPassword" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">New Password:</label>
        <input type="password" id="newPassword" formControlName="newPassword" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="confirmNewPassword" class="form-label">Confirm New Password:</label>
        <input type="password" id="confirmNewPassword" formControlName="confirmNewPassword" class="form-control" required>
      </div>
      <button type="submit" [disabled]="!changePasswordForm.valid" class="btn btn-primary">Change Password</button>
    </form>
  </div>
