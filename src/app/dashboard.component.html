<div class="title-bar">
  <h1>SGC</h1>
  <button (click)="logout()" class="logout-button">Logout</button>
</div>

<div class="dashboard-container">
  <h3>Request Study Material</h3>
  <form (ngSubmit)="requestMaterial()">
    <div class="mb-3">
      <label for="materialType" class="form-label">Material Type:</label>
      <select class="form-select" id="materialType" [(ngModel)]="materialType" name="materialType" required>
        <option value="">Select a material type</option>
        <option value="test">Test</option>
        <option value="flashcards">Flashcards</option>
        <option value="quiz">Quiz</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary action-button">Request Material</button>
  </form>

  <app-semester></app-semester>
</div>

<ng-template #studyMaterialModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{modal.modalTitle}}</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <ng-container [ngSwitch]="materialType">
      <div *ngSwitchCase="'flashcards'" [innerHTML]="modalRef?.content"></div>
      <div *ngSwitchCase="'quiz'" [innerHTML]="modalRef?.content"></div>
      <div *ngSwitchDefault>{{modalRef?.content}}</div>
    </ng-container>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" (click)="saveMaterial(modal.content, modal.modalTitle)">Save Material</button>
  </div>
</ng-template>
