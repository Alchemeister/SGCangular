<div class="semester-container">
  <h3>Semesters</h3>

  <form (ngSubmit)="createSemester()">
    <input type="text" [(ngModel)]="newSemesterName" name="newSemesterName" placeholder="Enter new semester name">
    <button type="submit">Create Semester</button>
  </form>

  <ul>
    <li *ngFor="let semester of semesters$ | async">
      <input type="checkbox" [value]="semester._id" (change)="onItemSelect($event, 'semester', semester._id)">
      <span class="semester-name">
        {{ semester.name }} 
        <button class="expand-button" (click)="onSemesterSelect(semester._id, $event)">
          <span class="plus-sign" *ngIf="(selectedSemesterId$ | async) !== semester._id">+</span>
          <span class="minus-sign" *ngIf="(selectedSemesterId$ | async) === semester._id">-</span>
        </button>
      </span>

      <ul *ngIf="(selectedSemesterId$ | async) === semester._id">
        <li *ngFor="let classList of classLists$ | async">
          <input type="checkbox" [value]="classList._id" (change)="onItemSelect($event, 'classList', classList._id)">
          <span class="class-list-name"> 
            {{ classList.name }} 
            <button class="btn btn-link btn-sm expand-button" (click)="onClassListSelect(classList, $event)">
              <span class="plus-sign" *ngIf="(selectedClassListId$ | async) !== classList._id">+</span>
              <span class="minus-sign" *ngIf="(selectedClassListId$ | async) === classList._id">-</span>
            </button>
          </span>

          <!-- Chapters Display -->
          <ul *ngIf="(selectedClassListId$ | async) === classList._id"> 
            <li *ngFor="let chapter of chapters$ | async">
              <input type="checkbox" [value]="chapter._id" (change)="onItemSelect($event, 'chapter', chapter._id)">
              {{ chapter.name }}

              <ul *ngIf="chapter.fileUploadIds && chapter.fileUploadIds.length > 0">
                <li *ngFor="let file of chapter.fileUploadIds">
                  <input type="checkbox"
                         [value]="file._id"
                         [checked]="(selectedFileIds$ | async)?.includes(file._id)"
                         (change)="onItemSelect($event, 'file', file._id)">
                  {{ file.originalFilename }}
                </li>
              </ul>                  
              <ng-container *ngIf="!chapter.fileUploadIds || chapter.fileUploadIds.length === 0">
                <p>No files uploaded for this chapter.</p>
              </ng-container>
            </li> 
          </ul> 
        </li>
      </ul>
    </li>
  </ul>
</div>

<div> 
  <input 
    type="file"
    #fileInput
    style="display: none;"
    (change)="onFileSelected($event)"
    multiple />
  <button (click)="triggerFileUpload()" [disabled]="!(isExactlyOneChapterSelected() | async)">
    Upload File
  </button>
  <button (click)="deleteSelectedItems()" 
        [disabled]="(selectedSemesterIds$ | async)?.length === 0 && 
                    (selectedClassListIds$ | async)?.length === 0 && 
                    (selectedChapterIds$ | async)?.length === 0 && 
                    (selectedFileIds$ | async)?.length === 0">
  Delete Selected
</button>
  <button (click)="createClassList()" [disabled]="!(isExactlyOneSemesterSelected$ | async)">
    Create Class List
  </button>
  <button (click)="createChapter()" [disabled]="!(isExactlyOneClassListSelected$ | async)">
    Create Chapter
  </button>  
</div>
