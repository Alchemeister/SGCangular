<div class="semester-container">
  <h3>Semesters</h3>

  <form (ngSubmit)="createSemester()">
    <input type="text" [(ngModel)]="newSemesterName" name="newSemesterName" placeholder="Enter new semester name">
    <button type="submit">Create Semester</button>
  </form>

  <ul>
    <li *ngFor="let semester of semesters$ | async">
      <input type="checkbox" [value]="semester?._id" (change)="onItemSelect($event, 'semester', semester?._id)">
      <a href="#" (click)="onSemesterSelect(semester?._id)">{{ semester?.name }}</a>

      <ul *ngIf="(selectedSemesterId$ | async) === semester?._id">
        <li *ngFor="let classList of classLists$ | async">
          <input type="checkbox" [value]="classList?._id" (change)="onItemSelect($event, 'classList', classList?._id)">
          <span>
            <a href="#" (click)="onClassListSelect(classList)">{{ classList?.name }}</a>
            <ul *ngIf="(selectedClassListId$ | async) === classList?._id">
              <ng-container *ngIf="(chapters$ | async) as chapters">
                <li *ngFor="let chapter of chapters">
                  <input type="checkbox" [value]="chapter._id" (change)="onItemSelect($event, 'chapter', chapter._id)">
                  {{ chapter.name }}
                  <ul *ngIf="chapter.fileUploadIds && chapter.fileUploadIds.length > 0">
                    <li *ngFor="let fileId of chapter.fileUploadIds">
                      <input type="checkbox"
                             [value]="fileId"
                             [checked]="(selectedFileIds$ | async)?.includes(fileId)"
                             (change)="onItemSelect($event, 'file', fileId)">
                      {{ fileId }} <!-- You might want to fetch and display actual file names -->
                    </li>
                  </ul>
                  <ng-container *ngIf="!chapter.fileUploadIds || chapter.fileUploadIds.length === 0">
                    <p>No files uploaded for this chapter.</p>
                  </ng-container>
                </li>
              </ng-container>
              <li>
                <form (ngSubmit)="createChapter(classList._id)">
                  <input type="text" [(ngModel)]="newChapterName" name="newChapterName" placeholder="Enter chapter name">
                  <button type="submit">Create Chapter</button>
                </form>
              </li>
            </ul>
          </span>
        </li>
        <li>
          <form (ngSubmit)="createClassList(semester?._id)">
            <input type="text" [(ngModel)]="newClassListName" name="newClassListName" placeholder="Enter class list name">
            <button type="submit">Create Class List</button>
          </form>
        </li>
      </ul>
    </li>
  </ul>
</div>

<div>
  <input
    type="file"
    #fileInput
    style="display: none;"
    (change)="onFileSelected($event)"
    multiple />
  <button (click)="triggerFileUpload()" [disabled]="!(isExactlyOneChapterSelected() | async)">
    Upload File
  </button>
  <button (click)="deleteSelectedItems()" [disabled]="(selectedFileIds$ | async)?.length === 0 && (selectedChapterIds$ | async)?.length === 0">
    Delete Selected
  </button>
</div>
